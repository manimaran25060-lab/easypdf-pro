<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Resizer - EasyPDF Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">EasyPDF Pro</div>
  <nav>
    <a href="/">Home</a>
    <a href="/image-resizer.html">Resize</a>
    <a href="/image-compressor.html">Compress</a>
    <a href="/image-converter.html">Convert</a>
  </nav>
</header>

<main class="tool-container">
  <h1>Image Resizer</h1>
  <p class="subtitle">Resize images by percentage or custom dimensions. 100% browser based.</p>

  <div class="card">

    <input type="file" id="imageInput" accept="image/*">

    <div class="resize-options">
      <label>
        <input type="radio" name="mode" value="percent" checked>
        Percentage (%)
      </label>
      <label>
        <input type="radio" name="mode" value="custom">
        Width & Height
      </label>
    </div>

    <div id="percentBox">
      <input type="range" id="percent" min="10" max="200" value="50">
      <span id="percentLabel">50%</span>
    </div>

    <div id="customBox" style="display:none;">
      <input type="number" id="width" placeholder="Width (px)">
      <input type="number" id="height" placeholder="Height (px)">
    </div>

    <button id="resizeBtn">Resize & Download</button>

  </div>
</main>

<footer>
  © 2026 EasyPDF Pro
</footer>

<script src="resizer.js"></script>
</body>
</html>
