<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Converter – EasyPDF Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">EasyPDF<span>Pro</span></div>
  <nav>
    <a href="/">Home</a>
    <a href="/image-resizer.html">Resize</a>
    <a href="/image-compressor.html">Compress</a>
    <a href="/image-converter.html" class="active">Convert</a>
  </nav>
</header>

<main class="tool-container">
  <h1>Image Converter</h1>
  <p class="subtitle">
    Convert images between JPG, PNG, WEBP, AVIF and more.
    100% browser-based.
  </p>

  <div class="card">
    <input type="file" id="inputImage" accept="image/*">

    <label>Convert to</label>
    <select id="format">
      <option value="image/jpeg">JPG</option>
      <option value="image/png">PNG</option>
      <option value="image/webp">WEBP</option>
    </select>

    <button onclick="convertImage()">Convert & Download</button>
  </div>
</main>

<footer>
  © 2026 EasyPDF Pro
</footer>

<script src="converter.js"></script>
</body>
</html>
