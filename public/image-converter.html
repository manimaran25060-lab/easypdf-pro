<body>

<header class="nav">

<main class="tool-container">
  <h1>Image Converter</h1>
  <p>Convert images between JPG, PNG, WEBP, AVIF and more.</p>

  <div class="card">
    <input type="file" id="fileInput" accept="image/*">
    <br><br>

    <label>Select output format</label>
    <select>
      <option>PNG</option>
      <option>JPG</option>
      <option>WEBP</option>
      <option>AVIF</option>
    </select>

    <br><br>
    <button class="primary-btn">Convert & Download</button>
  </div>
</main>
